<div style="width: 390px; height: 920px; box-sizing: border-box; position: relative; overflow: hidden; background: #000000; color: #ffffff; display: flex; flex-direction: column; gap: 14px; padding: 52px 16px 34px;">

<div style="display: flex; align-items: center; justify-content: space-between;">
<a href="Main.dc.html" aria-label="Close without saving" style="width: 44px; height: 44px; border-radius: 22px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.12); background: #1B1B1D; color: #ffffff; display: flex; align-items: center; justify-content: center; text-decoration: none;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>

<a href="Main.dc.html" aria-label="Save commute" style="width: 44px; height: 44px; border-radius: 22px; background: #F28C38; color: #1A0F04; display: flex; align-items: center; justify-content: center; text-decoration: none;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>

</div>

<h1 style="margin: 4px 4px 0; font-size: 32px; line-height: 38px; font-weight: 800; letter-spacing: -0.02em;">Your commute</h1>

<div style="border-radius: 22px; background: #1B1B1D; display: flex; flex-direction: column;">
<button style="display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 8px 16px; border: none; background: transparent; color: #ffffff; text-align: left;">
<span style="width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><span style="width: 12px; height: 12px; border-radius: 8px; border: 3px solid #ffffff;"></span></span>
<span style="display: flex; flex-direction: column; gap: 1px;"><span style="font-size: 13px; color: #A1A1A6;">From</span><span style="font-size: 16px; font-weight: 600;">[HOME ADDRESS]</span></span>
</button>
<div style="height: 1px; margin-left: 52px; background: rgba(255,255,255,0.07);"></div>
<button style="display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 8px 16px; border: none; background: transparent; color: #ffffff; text-align: left;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F28C38" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
<span style="display: flex; flex-direction: column; gap: 1px;"><span style="font-size: 13px; color: #A1A1A6;">To</span><span style="font-size: 16px; font-weight: 600;">[WORK ADDRESS]</span></span>
</button>
</div>

<div style="border-radius: 22px; background: #1B1B1D; display: flex; flex-direction: column;">
<button style="display: flex; align-items: center; gap: 14px; min-height: 54px; padding: 0 16px; border: none; background: transparent; color: #ffffff; text-align: left; font-size: 16px;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A1A1A6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 21V4M6 5h11l-2 4 2 4H6"></path></svg>
<span style="flex-grow: 1;">Arrive by</span>
<span style="color: #A1A1A6;">9:00</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A1A1A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 9 4-4 4 4M8 15l4 4 4-4"></path></svg>
</button>
<div style="height: 1px; margin-left: 52px; background: rgba(255,255,255,0.07);"></div>
<button style="display: flex; align-items: center; gap: 14px; min-height: 54px; padding: 0 16px; border: none; background: transparent; color: #ffffff; text-align: left; font-size: 16px;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A1A1A6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>
<span style="flex-grow: 1;">Usual departure</span>
<span style="color: #A1A1A6;">8:20</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A1A1A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 9 4-4 4 4M8 15l4 4 4-4"></path></svg>
</button>
<div style="height: 1px; margin-left: 52px; background: rgba(255,255,255,0.07);"></div>
<button style="display: flex; align-items: center; gap: 14px; min-height: 54px; padding: 0 16px; border: none; background: transparent; color: #ffffff; text-align: left; font-size: 16px;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A1A1A6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 5 6v6c0 4.5 3 7.5 7 9 4-1.5 7-4.5 7-9V6z"></path></svg>
<span style="flex-grow: 1;">Buffer</span>
<span style="color: #A1A1A6;">10 min</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A1A1A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 9 4-4 4 4M8 15l4 4 4-4"></path></svg>
</button>
<div style="height: 1px; margin-left: 52px; background: rgba(255,255,255,0.07);"></div>
<button style="display: flex; align-items: center; gap: 14px; min-height: 54px; padding: 0 16px; border: none; background: transparent; color: #ffffff; text-align: left; font-size: 16px;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A1A1A6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 8v8M8 12h8"></path></svg>
<span style="flex-grow: 1;">Parking time</span>
<span style="color: #A1A1A6;">5 min</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A1A1A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 9 4-4 4 4M8 15l4 4 4-4"></path></svg>
</button>
</div>

<div role="group" aria-label="How you travel" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 3px; border-radius: 24px; background: #1B1B1D;">
<button aria-pressed="true" style="height: 42px; border: none; border-radius: 21px; background: #5A5A60; color: #ffffff; font-size: 15px; font-weight: 600;">I drive</button>
<button aria-pressed="false" style="height: 42px; border: none; border-radius: 21px; background: transparent; color: #ffffff; font-size: 15px; font-weight: 600;">Ride-hail</button>
</div>

<div style="display: flex; flex-direction: column; gap: 8px;">
<span style="padding: 4px 6px 0; font-size: 15px; font-weight: 700;">Who to tell if you are late</span>
<div style="border-radius: 22px; background: #1B1B1D; display: flex; flex-direction: column;">
<button style="display: flex; align-items: center; gap: 14px; min-height: 54px; padding: 0 16px; border: none; background: transparent; color: #ffffff; text-align: left; font-size: 16px;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A1A1A6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
<span style="flex-grow: 1;">Name</span>
<span style="color: #A1A1A6;">Mary</span>
</button>
<div style="height: 1px; margin-left: 52px; background: rgba(255,255,255,0.07);"></div>
<button style="display: flex; align-items: center; gap: 14px; min-height: 54px; padding: 0 16px; border: none; background: transparent; color: #ffffff; text-align: left; font-size: 16px;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A1A1A6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h4l1.5 5-2.5 1.5a12 12 0 0 0 5.5 5.5L16 12.5l5 1.5v4a2 2 0 0 1-2 2A16 16 0 0 1 4 5a2 2 0 0 1 2-2z"></path></svg>
<span style="flex-grow: 1;">Phone</span>
<span style="color: #A1A1A6;">[PHONE NUMBER]</span>
</button>
<div style="height: 1px; margin-left: 52px; background: rgba(255,255,255,0.07);"></div>
<button style="display: flex; align-items: center; gap: 14px; min-height: 54px; padding: 0 16px; border: none; background: transparent; color: #ffffff; text-align: left; font-size: 16px;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A1A1A6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="7.5" width="17" height="12" rx="2"></rect><path d="M9 7.5V5.5h6v2"></path></svg>
<span style="flex-grow: 1;">Relationship</span>
<span style="color: #A1A1A6;">Manager</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A1A1A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 9 4-4 4 4M8 15l4 4 4-4"></path></svg>
</button>
</div>
</div>

<p style="margin: auto 0 0; text-align: center; font-size: 13px; line-height: 18px; color: #A1A1A6;">Saved on this phone only. No account needed.</p>

</div>
</x-dc>

</html>

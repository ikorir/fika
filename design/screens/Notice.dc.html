<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Late notice sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Figtree,system-ui,sans-serif;background:#000;color:#fff}
button,textarea{font-family:inherit}
a{color:#F28C38}a:hover{color:#ffab66}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #000000; color: #ffffff; display: flex; flex-direction: column;">

<div aria-hidden="true" style="flex-grow: 1; padding: 64px 20px 0; display: flex; flex-direction: column; gap: 6px; opacity: 0.28;">
<span style="font-size: 14px; font-weight: 600; color: #A1A1A6;">Arriving</span>
<span style="font-size: 64px; line-height: 64px; font-weight: 800; letter-spacing: -0.03em; color: #FF6B5E;">9:15</span>
</div>

<div style="border-radius: 32px 32px 0 0; background: #1B1B1D; padding: 16px 16px 34px; display: flex; flex-direction: column; gap: 14px;">

<div style="display: flex; align-items: center; justify-content: space-between;">
<a href="Late.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.12); background: #2A2A2D; color: #ffffff; display: flex; align-items: center; justify-content: center; text-decoration: none;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
</a>
<div role="group" aria-label="Tone" style="display: flex; padding: 3px; border-radius: 20px; background: #2E2E31;">
<button aria-pressed="true" style="height: 34px; padding: 0 18px; border: none; border-radius: 17px; background: #5A5A60; color: #ffffff; font-size: 15px; font-weight: 600;">Manager</button>
<button aria-pressed="false" style="height: 34px; padding: 0 18px; border: none; border-radius: 17px; background: transparent; color: #ffffff; font-size: 15px; font-weight: 600;">Friend</button>
</div>
<span style="width: 44px; height: 44px;"></span>
</div>

<div role="group" aria-label="Language" style="display: flex; gap: 8px;">
<button aria-pressed="true" style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #F28C38; background: #2A1A0C; color: #F9A45C; font-size: 15px; font-weight: 600;">English</button>
<button aria-pressed="false" style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.14); background: transparent; color: #ffffff; font-size: 15px; font-weight: 600;">Swahili</button>
<button aria-pressed="false" style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.14); background: transparent; color: #ffffff; font-size: 15px; font-weight: 600;">Sheng</button>
</div>

<div style="border-radius: 18px; background: #252527; display: flex; flex-direction: column;">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.07);">
<span style="font-size: 14px; color: #A1A1A6;">To</span>
<span style="font-size: 15px; font-weight: 600;">Mary · manager</span>
</div>
<label for="noticeText" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%);">Message</label>
<textarea id="noticeText" rows="5" style="box-sizing: border-box; width: 100%; height: 138px; padding: 14px 16px; border: none; border-radius: 0 0 18px 18px; background: transparent; color: #ffffff; font-size: 16px; line-height: 23px; resize: none; outline-color: #F28C38;">Hi Mary, there has been an accident on Waiyaki Way and traffic is very slow. I will be about 15 minutes late. My ETA is 9:15. Apologies for the delay.</textarea>
</div>

<div style="display: flex; align-items: center; gap: 8px;">
<span style="display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 14px; background: #2A2A2D; color: #D6D6DB; font-size: 13px; font-weight: 600;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>ETA 9:15</span>
<span style="display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 14px; background: #2A2A2D; color: #D6D6DB; font-size: 13px; font-weight: 600;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>15 min late</span>
<span style="font-size: 13px; color: #A1A1A6;">from your route, not AI</span>
</div>

<button style="display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 56px; border: none; border-radius: 28px; background: #F28C38; color: #1A0F04; font-size: 17px; font-weight: 700;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 4 3 11l7 3 3 7zM10 14 20 4"></path></svg>
Send on WhatsApp
</button>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
<button style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 50px; border-radius: 25px; border: 1px solid rgba(255,255,255,0.14); background: #252527; color: #ffffff; font-size: 16px; font-weight: 600;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>
SMS
</button>
<button style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 50px; border-radius: 25px; border: 1px solid rgba(255,255,255,0.14); background: #252527; color: #ffffff; font-size: 16px; font-weight: 600;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4M5 12v7h14v-7"></path></svg>
Share
</button>
</div>
<p style="margin: 0; text-align: center; font-size: 13px; line-height: 18px; color: #A1A1A6;">Fika opens a prefilled message. Nothing goes out until you press send.</p>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
